services:
  php-fpm:
    build:
      context: './docker/php-${PHPDEV_PHP_VERSION}-fpm'
      dockerfile: Dockerfile
    container_name: 'phpdev'
    volumes:
      - './htdocs:/var/www/html'
      - './docker/php-${PHPDEV_PHP_VERSION}-fpm/php/conf.d/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini'
      - './docker/php-${PHPDEV_PHP_VERSION}-fpm/php/conf.d/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini'
      - './docker/php-${PHPDEV_PHP_VERSION}-fpm/php/conf.d/overrides.ini:/usr/local/etc/php/conf.d/overrides.ini'
    env_file:
      - './env/php.env'

  nginx:
    image: 'nginx:${PHPDEV_NGINX_VERSION}'
    container_name: 'phpdev-nginx'
    depends_on:
      - php-fpm
    ports:
       - '${PHPDEV_NGINX_PORT:-8000}:80'
    volumes:
      - './htdocs:/etc/nginx/html'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'

  beanstalkd:
    profiles: ['beanstalkd']
    build:
      context: './docker/beanstalkd'
      dockerfile: Dockerfile
    container_name: 'phpdev-beanstalkd'
    ports:
      - '${PHPDEV_BEANSTALKD_PORT:-11300}:11300'

  redis:
    profiles: ['redis']
    image: 'redis:${PHPDEV_REDIS_VERSION}'
    container_name: 'phpdev-redis'
    ports:
      - '${PHPDEV_REDIS_PORT:-6379}:6379'
    volumes:
      - './storage/redis:/data'
    environment:
      REDIS_ARGS: --appendonly yes

  redis-insight:
    profiles: ['redis']
    image: 'redis/redisinsight:${PHPDEV_REDIS_INSIGHT_VERSION}'
    container_name: 'phpdev-redis-insight'
    ports:
      - '${PHPDEV_REDIS_INSIGHT_PORT:-13333}:5540'
    volumes:
      - './storage/redis-insight:/data'
    environment:
      RI_REDIS_HOST: phpdev-redis

  postgres:
    profiles: ['postgres']
    image: 'postgres:${PHPDEV_POSTGRES_VERSION}'
    container_name: 'phpdev-postgresql'
    ports:
      - '${PHPDEV_POSTGRES_PORT:-5432}:5432'
    volumes:
      - './storage/postgres:${PHPDEV_POSTGRES_DATA_PATH}'
    environment:
      POSTGRES_USER: 'root'
      POSTGRES_PASSWORD: ${PHPDEV_POSTGRES_ROOT_PASSWORD}

  mariadb:
    profiles: ['mariadb']
    image: 'mariadb:${PHPDEV_MARIADB_VERSION}'
    container_name: 'phpdev-mariadb'
    ports:
      - '${PHPDEV_MARIADB_PORT:-3306}:3306'
    volumes:
      - './storage/mariadb:${PHPDEV_MARIADB_DATA_PATH}'
    environment:
      MYSQL_ROOT_PASSWORD: ${PHPDEV_MARIADB_ROOT_PASSWORD}

  mysql:
    profiles: ['mysql']
    image: 'mysql:${PHPDEV_MYSQL_VERSION}'
    container_name: 'phpdev-mysql'
    ports:
      - '${PHPDEV_MYSQL_PORT:-3307}:3306'
    volumes:
      - './storage/mysql:${PHPDEV_MYSQL_DATA_PATH}'
    environment:
      MYSQL_ROOT_PASSWORD: ${PHPDEV_MYSQL_ROOT_PASSWORD}

  mailpit:
    profiles: ['mailpit']
    image: 'axllent/mailpit'
    container_name: 'phpdev-mailpit'
    ports:
      - '${PHPDEV_MAILPIT_PORT:-8025}:8025'

  mongo:
    profiles: ['mongo']
    image: 'mongo:${PHPDEV_MONGODB_VERSION}'
    container_name: 'phpdev-mongo'
    ports:
      - '${PHPDEV_MONGODB_PORT:-27017}:27017'
    volumes:
      - './storage/mongodb:/data/db'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PHPDEV_MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PHPDEV_MONGODB_ROOT_PASSWORD}

  mongo-express:
    profiles: ['mongo']
    image: 'mongo-express:${PHPDEV_MONGOE_VERSION}'
    container_name: 'phpdev-mongo-express'
    depends_on:
      mongo:
        condition: service_started
    ports:
      - '${PHPDEV_MONGOE_PORT:-8081}:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${PHPDEV_MONGOE_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${PHPDEV_MONGOE_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${PHPDEV_MONGODB_ROOT_USERNAME}:${PHPDEV_MONGODB_ROOT_PASSWORD}@phpdev-mongo:27017/
