services:
  php-fpm:
    build:
      context: './docker/php-${PHP_VERSION}-fpm'
      dockerfile: Dockerfile
    container_name: 'phpdev'
    volumes:
      - './htdocs:/var/www/html'
      - './docker/php-${PHP_VERSION}-fpm/php/conf.d/docker-php-ext-opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini'
      - './docker/php-${PHP_VERSION}-fpm/php/conf.d/docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini'
      - './docker/php-${PHP_VERSION}-fpm/php/conf.d/overrides.ini:/usr/local/etc/php/conf.d/overrides.ini'
    env_file:
      - './env/php.env'

  nginx:
    image: 'nginx:${NGINX_VERSION}'
    container_name: 'phpdev-nginx'
    depends_on:
      - php-fpm
    ports:
      - '8000:80'
    volumes:
      - './htdocs:/etc/nginx/html'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'

  beanstalkd:
    profiles: ['beanstalkd']
    build:
      context: './docker/beanstalkd'
      dockerfile: Dockerfile
    container_name: 'phpdev-beanstalkd'
    ports:
      - '11300:11300'

  redis:
    profiles: ['redis']
    image: 'redis:${REDIS_VERSION}'
    container_name: 'phpdev-redis'
    ports:
      - '6379:6379'
    volumes:
      - './storage/redis:/data'
    environment:
      REDIS_ARGS: --appendonly yes

  redis-insight:
    profiles: ['redis']
    image: 'redis/redisinsight:${REDIS_INSIGHT_VERSION}'
    container_name: 'phpdev-redis-insight'
    ports:
      - '13333:5540'
    volumes:
      - './storage/redis-insight:/data'
    environment:
      RI_REDIS_HOST: phpdev-redis

  postgres:
    profiles: ['postgres']
    image: 'postgres:${POSTGRES_VERSION}'
    container_name: 'phpdev-postgresql'
    ports:
      - '5432:5432'
    volumes:
      - './storage/postgres:${POSTGRES_DATA_PATH}'
    environment:
      POSTGRES_USER: 'root'
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}

  mariadb:
    profiles: ['mariadb']
    image: 'mariadb:${MARIADB_VERSION}'
    container_name: 'phpdev-mariadb'
    ports:
      - '3306:3306'
    volumes:
      - './storage/mariadb:${MARIADB_DATA_PATH}'
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

  mysql:
    profiles: ['mysql']
    image: 'mysql:${MYSQL_VERSION}'
    container_name: 'phpdev-mysql'
    ports:
      - '3307:3306'
    volumes:
      - './storage/mysql:${MYSQL_DATA_PATH}'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  mailpit:
    profiles: ['mailpit']
    image: 'axllent/mailpit'
    container_name: 'phpdev-mailpit'
    ports:
      - '8025:8025'

  mongo:
    profiles: ['mongo']
    image: 'mongo:${MONGODB_VERSION}'
    container_name: 'phpdev-mongo'
    ports:
      - '27017:27017'
    volumes:
      - './storage/mongodb:/data/db'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}

  mongo-express:
    profiles: ['mongo']
    image: 'mongo-express:${MONGOE_VERSION}'
    container_name: 'phpdev-mongo-express'
    depends_on:
      mongo:
        condition: service_started
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGOE_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGOE_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@phpdev-mongo:27017/
